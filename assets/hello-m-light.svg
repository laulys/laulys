<svg xmlns="http://www.w3.org/2000/svg" width="114" height="78" viewBox="0 0 114 78" role="img" aria-label="Say hello. Send me a note" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,'Helvetica Neue',Arial,sans-serif"><title>Say hello. Send me a note</title><style>@media (prefers-reduced-motion:no-preference){.in{animation:in .8s cubic-bezier(.23,1,.32,1) backwards}@keyframes in{from{opacity:.72;transform:translateY(9px)}}.au{animation:au 1.8s cubic-bezier(.23,1,.32,1) backwards;transform-origin:50% 0}@keyframes au{from{opacity:.5;transform:scaleY(.5)}}.ry{animation:ry 9s ease-in-out 1.6s 6 alternate}@keyframes ry{to{transform:translateX(var(--d))}}.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1) .75s backwards;transform-box:fill-box;transform-origin:center}@keyframes pop{from{transform:scale(.6)}}.pu{animation:pu 2.4s ease-out 1.6s 8 backwards;transform-box:fill-box;transform-origin:center}@keyframes pu{from{opacity:.3;transform:scale(1)}70%,to{opacity:0;transform:scale(2.3)}}.nf{animation:nf 3.2s ease-in-out 12 alternate}@keyframes nf{from{transform:translateY(1.5px)}to{transform:translateY(-3.5px)}}.sx{animation:sx .75s steps(9) 0s 96}@keyframes sx{to{transform:translateX(-2448px)}}.sy{animation:sy 6s steps(8) 0s 12}@keyframes sy{to{transform:translateY(-2176px)}}}</style><rect x="6.5" y=".5" width="107" height="77" rx="12.5" fill="#FFFFFF" stroke="#D1D9E0"/><g transform="translate(49.5 15) scale(1.05)" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.200c4.100 0 7.200 2.700 7.200 6.300s-3.100 6.300-7.200 6.300c-.8 0-1.600-.1-2.300-.3L4 17l.8-3.100A5.900 5.900 0 0 1 2.800 9.500c0-3.600 3.100-6.300 7.200-6.300z"/><path d="M7.300 10.600c.7 1 1.600 1.400 2.700 1.400s2-.4 2.700-1.400"/></g><text x="29.57" y="60" font-size="14" font-weight="600" textLength="60.86" lengthAdjust="spacingAndGlyphs" fill="#1F2328">Say hello</text></svg>